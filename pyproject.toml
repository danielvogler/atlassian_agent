[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlassian-agent-mcp"
version = "0.3.1"
description = "MCP-first Jira and Confluence tools for coding agents, where every write is a dry run first."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Vogler" }]
keywords = [
  "atlassian",
  "coding-agent",
  "confluence",
  "dry-run",
  "jira",
  "mcp",
  "mcp-server",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  # Capped at <5 deliberately. v5 restructured Confluence: the methods exist
  # only on an instance, not the class, and get_page_by_title's first parameter
  # was renamed `space` -> `space_key`. An unpinned range let two environments
  # resolve different majors and behave differently on identical code.
  "atlassian-python-api>=3.41.0,<5",
  # Bounded on both ends for the same reason. The floor is 4 because MCP SDK
  # v2 arrived with it and renamed the tool annotations this server sets
  # (`readOnlyHint` -> `read_only_hint`); supporting 3.x as well would mean
  # writing the deprecated spelling, which is what the whole annotation
  # exists to get right. The cap is tested, not assumed: the suite and all
  # twenty-two registrations pass against 4.0.3.
  "fastmcp>=4.0,<5",
  "python-dotenv>=1.0.1",
  "requests>=2.32.0",
  "typer>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/danielvogler/atlassian_agent"
Source = "https://github.com/danielvogler/atlassian_agent"
Issues = "https://github.com/danielvogler/atlassian_agent/issues"
Changelog = "https://github.com/danielvogler/atlassian_agent/blob/main/CHANGELOG.md"

[dependency-groups]
# Installed by default with `uv sync` / `uv run`, which is how this repo is
# meant to be driven. Nothing here is needed to run the MCP server.
dev = [
  "mypy>=1.11.0",
  "pre-commit>=3.7.0",
  "pytest>=8.2.0",
  "ruff>=0.5.0",
  "types-requests>=2.32.0",
]

[project.scripts]
atlassian-agent = "atlassian_agent.cli:app"
atlassian-agent-mcp = "atlassian_agent.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atlassian_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.11"
# atlassian-python-api and fastmcp ship no type information; everything this
# repo writes itself is still checked.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
