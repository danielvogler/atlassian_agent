<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" width="1280" height="680" role="img" aria-labelledby="ct cd">
  <title id="ct">Confluence and Jira from your coding editor</title>
  <desc id="cd">Your coding agent — Claude Code, Cursor, Gemini CLI or any MCP client — connects to one MCP server carrying twenty-two tools in four groups. Pages: create and edit them in Confluence's own format, so any layout and any macro works, and read them with their history. Spaces: read a whole page tree in one call, then work through every page in it. Issues: file and update them and move them along the workflow. Boards: search with JQL, see an issue's valid next steps, read structure boards. Every write returns a diff and stops until a person approves it. What comes out the other side is Confluence pages and spaces, and Jira issues and workflows.</desc>

  <defs>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="lift2" x="-20%" y="-20%" width="140%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#0052CC" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="680" fill="#0E0E10"/>
  <rect y="679" width="1280" height="1" fill="#2A2A2E"/>

  <g font-family="Archivo, ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">

    <circle cx="60" cy="48" r="4" fill="#0052CC"/>
    <text x="76" y="53" font-size="13" font-weight="600" letter-spacing="2.2" fill="#A3A39D">22 TOOLS · ONE MCP SERVER</text>
    <text x="56" y="112" font-size="42" font-weight="700" letter-spacing="-1.6" fill="#FDFDFB">Confluence and Jira from your coding editor.</text>

    <!-- wires in, wires out -->
    <g fill="none" stroke="#3A3A40" stroke-width="1.6" stroke-linecap="round">
      <path d="M 266 266 C 302 266, 306 272, 344 272"/>
      <path d="M 266 342 C 302 342, 306 340, 344 340"/>
      <path d="M 266 418 C 302 418, 306 412, 344 412"/>
      <path d="M 266 494 C 302 494, 306 476, 344 476"/>
    </g>
    <g fill="none" stroke="#9FBBEA" stroke-width="2" stroke-linecap="round">
      <path d="M 918 380 C 958 380, 958 315, 994 315"/>
      <path d="M 918 380 C 958 380, 958 445, 994 445"/>
    </g>
    <path d="M 994 315 l-9 -4.5 v9 z" fill="#9FBBEA"/>
    <path d="M 994 445 l-9 -4.5 v9 z" fill="#9FBBEA"/>

    <!-- who drives it -->
    <text x="56" y="214" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#A3A39D">YOUR CODING AGENT</text>
    <rect x="56" y="234" width="210" height="64" rx="14" fill="#17171A" stroke="#2A2A2E" stroke-width="1" filter="url(#lift)"/>
    <text x="80" y="272" font-size="16" font-weight="600" fill="#FDFDFB">Claude Code</text>
    <rect x="56" y="310" width="210" height="64" rx="14" fill="#17171A" stroke="#2A2A2E" stroke-width="1" filter="url(#lift)"/>
    <text x="80" y="348" font-size="16" font-weight="600" fill="#FDFDFB">Cursor</text>
    <rect x="56" y="386" width="210" height="64" rx="14" fill="#17171A" stroke="#2A2A2E" stroke-width="1" filter="url(#lift)"/>
    <text x="80" y="424" font-size="16" font-weight="600" fill="#FDFDFB">Gemini CLI</text>
    <rect x="56" y="462" width="210" height="64" rx="14" fill="#17171A" stroke="#2A2A2E" stroke-width="1" filter="url(#lift)"/>
    <text x="80" y="500" font-size="16" font-weight="500" fill="#A3A39D">any MCP client</text>

    <!-- what it can do -->
    <rect x="330" y="190" width="600" height="380" rx="28" fill="#0B5BD3" filter="url(#lift2)"/>
    <text x="360" y="238" font-size="24" font-weight="700" letter-spacing="-0.6" fill="#FFFFFF">Twenty-two tools, four jobs</text>
    <text x="360" y="262" font-size="13.5" font-weight="500" fill="#BBD3F7">Paste a Confluence URL — even a short /x/ link. No IDs to look up.</text>

    <rect x="360" y="282" width="262" height="96" rx="16" fill="#FFFFFF" fill-opacity="0.13" stroke="#FFFFFF" stroke-opacity="0.26"/>
    <text x="382" y="312" font-size="16" font-weight="700" fill="#FFFFFF">Pages</text>
    <text x="382" y="336" font-size="12.5" fill="#D6E4FA">Create and edit them</text>
    <text x="382" y="356" font-size="12.5" fill="#D6E4FA">Any layout, any macro</text>

    <rect x="638" y="282" width="262" height="96" rx="16" fill="#FFFFFF" fill-opacity="0.13" stroke="#FFFFFF" stroke-opacity="0.26"/>
    <text x="660" y="312" font-size="16" font-weight="700" fill="#FFFFFF">Spaces</text>
    <text x="660" y="336" font-size="12.5" fill="#D6E4FA">A whole tree in one call</text>
    <text x="660" y="356" font-size="12.5" fill="#D6E4FA">Then edit every page in it</text>

    <rect x="360" y="394" width="262" height="96" rx="16" fill="#FFFFFF" fill-opacity="0.13" stroke="#FFFFFF" stroke-opacity="0.26"/>
    <text x="382" y="424" font-size="16" font-weight="700" fill="#FFFFFF">Issues</text>
    <text x="382" y="448" font-size="12.5" fill="#D6E4FA">File and update them</text>
    <text x="382" y="468" font-size="12.5" fill="#D6E4FA">Move them along the workflow</text>

    <rect x="638" y="394" width="262" height="96" rx="16" fill="#FFFFFF" fill-opacity="0.13" stroke="#FFFFFF" stroke-opacity="0.26"/>
    <text x="660" y="424" font-size="16" font-weight="700" fill="#FFFFFF">Boards</text>
    <text x="660" y="448" font-size="12.5" fill="#D6E4FA">Search with JQL</text>
    <text x="660" y="468" font-size="12.5" fill="#D6E4FA">Structure boards and rows</text>

    <rect x="360" y="506" width="540" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.3"/>
    <circle cx="384" cy="526" r="4.5" fill="#FF5C63"/>
    <text x="400" y="531" font-size="13.5" font-weight="600" fill="#FFFFFF">Nine of them change something — each returns a diff and stops until you say yes</text>

    <!-- where it lands -->
    <text x="994" y="214" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#A3A39D">IT LANDS IN</text>
    <rect x="994" y="260" width="230" height="110" rx="16" fill="#17171A" stroke="#2A2A2E" stroke-width="1" filter="url(#lift)"/>
    <path d="M 999.42 264 A 16 16 0 0 1 1010 260 L 1208 260 A 16 16 0 0 1 1218.58 264 Z" fill="#0052CC"/>
    <text x="1018" y="300" font-size="19" font-weight="700" letter-spacing="-0.4" fill="#FDFDFB">Confluence</text>
    <text x="1018" y="324" font-size="13" fill="#A3A39D">Pages, trees, macros</text>
    <text x="1018" y="346" font-size="13" fill="#A3A39D">Comments and labels</text>

    <rect x="994" y="390" width="230" height="110" rx="16" fill="#17171A" stroke="#2A2A2E" stroke-width="1" filter="url(#lift)"/>
    <path d="M 999.42 394 A 16 16 0 0 1 1010 390 L 1208 390 A 16 16 0 0 1 1218.58 394 Z" fill="#FDFDFB"/>
    <text x="1018" y="430" font-size="19" font-weight="700" letter-spacing="-0.4" fill="#FDFDFB">Jira</text>
    <text x="1018" y="454" font-size="13" fill="#A3A39D">Issues and workflows</text>
    <text x="1018" y="476" font-size="13" fill="#A3A39D">Boards and structures</text>

    <circle cx="60" cy="616" r="4" fill="#FF000D"/>
    <text x="76" y="621" font-size="14" fill="#A3A39D">A page that moved on in the meantime refuses, rather than quietly reverting whoever edited it.</text>
    <text x="76" y="644" font-size="14" fill="#A3A39D">You read a page as text so nothing gets mangled, and write it back as Confluence's own format.</text>
  </g>
</svg>
